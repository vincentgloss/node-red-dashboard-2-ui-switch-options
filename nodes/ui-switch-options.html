<script type="text/javascript">
    RED.nodes.registerType('ui-switch-options', {
        category: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category'),
        color: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.colors.light'),
        defaults: {
            name: { value: '' },
            group: { type: 'ui-group', required: true },
            order: { value: 0 },
            width: {
                value: 0,
                validate: function (v) {
                    const width = v || 0
                    const currentGroup = $('#node-input-group').val() || this.group
                    const groupNode = RED.nodes.node(currentGroup)
                    const valid = !groupNode || +width <= +groupNode.width
                    $('#node-input-size').toggleClass('input-error', !valid)
                    return valid
                }
            },
            height: { value: 0 },
            label: { value: '' },
            options: {
                value: [],
                validate: function (v) { return Array.isArray(v) }
            },
            prevIcon: { value: '' },
            nextIcon: { value: '' },
            iconColor: { value: '' },
            iconSize: { value: '' },
            buttonColor: { value: '' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-exchange',
        paletteLabel: 'switch option',
        label: function () {
            return this.name || 'switch option'
        },

        oneditprepare: function () {
            const node = this

            $('#node-input-size').elementSizer({
                width: '#node-input-width',
                height: '#node-input-height',
                group: '#node-input-group'
            })

            $('#node-input-options-list').editableList({
                addItem: function (container, index, option) {
                    option = option || { label: '', value: '' }
                    const row = $('<div/>', { style: 'display: flex; gap: 10px;' }).appendTo(container)
                    $('<input/>', { type: 'text', class: 'node-input-option-label', style: 'flex: 1;', placeholder: node._('ui-switch-options.label.optionLabel') })
                        .appendTo(row).val(option.label)
                    $('<input/>', { type: 'text', class: 'node-input-option-value', style: 'flex: 1;', placeholder: node._('ui-switch-options.label.optionValue') })
                        .appendTo(row).val(option.value)
                },
                header: $('<div/>', { style: 'display: flex; gap: 10px; padding-left: 28px; padding-right: 32px;' }).append(
                    $('<div/>', { style: 'flex: 1;' }).text(node._('ui-switch-options.label.optionLabel')),
                    $('<div/>', { style: 'flex: 1;' }).text(node._('ui-switch-options.label.optionValue'))
                ),
                sortable: true,
                removable: true,
                height: 'auto',
                scrollOnAdd: true
            })

            for (const option of node.options || []) {
                $('#node-input-options-list').editableList('addItem', option)
            }
        },

        oneditsave: function () {
            const node = this
            node.options = []
            $('#node-input-options-list').editableList('items').each(function () {
                const label = $(this).find('.node-input-option-label').val()
                const value = $(this).find('.node-input-option-value').val()
                // An option needs a value. Without a label the value is shown.
                if (value !== '') node.options.push({ label: label || value, value })
            })
        }
    })
</script>

<script type="text/html" data-template-name="ui-switch-options">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="ui-switch-options.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]ui-switch-options.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-group"><i class="fa fa-table"></i> <span data-i18n="ui-switch-options.label.group"></span></label>
        <input type="text" id="node-input-group">
    </div>
    <div class="form-row">
        <label><i class="fa fa-object-group"></i> <span data-i18n="ui-switch-options.label.size"></span></label>
        <input type="hidden" id="node-input-width">
        <input type="hidden" id="node-input-height">
        <button class="editor-button" id="node-input-size"></button>
    </div>
    <div class="form-row">
        <label for="node-input-label"><i class="fa fa-i-cursor"></i> <span data-i18n="ui-switch-options.label.label"></span></label>
        <input type="text" id="node-input-label" data-i18n="[placeholder]ui-switch-options.placeholder.label">
    </div>
    <div class="form-row node-input-options-container-row">
        <label><i class="fa fa-list"></i> <span data-i18n="ui-switch-options.label.options"></span></label>
        <ol id="node-input-options-list"></ol>
    </div>
    <div class="form-row">
        <label for="node-input-prevIcon"><i class="fa fa-arrow-left"></i> <span data-i18n="ui-switch-options.label.prevIcon"></span></label>
        <input type="text" id="node-input-prevIcon" placeholder="chevron-double-left">
    </div>
    <div class="form-row">
        <label for="node-input-nextIcon"><i class="fa fa-arrow-right"></i> <span data-i18n="ui-switch-options.label.nextIcon"></span></label>
        <input type="text" id="node-input-nextIcon" placeholder="chevron-double-right">
    </div>
    <div class="form-row">
        <label for="node-input-iconColor"><i class="fa fa-paint-brush"></i> <span data-i18n="ui-switch-options.label.iconColor"></span></label>
        <input type="text" id="node-input-iconColor" data-i18n="[placeholder]ui-switch-options.placeholder.color">
    </div>
    <div class="form-row">
        <label for="node-input-iconSize"><i class="fa fa-arrows-alt"></i> <span data-i18n="ui-switch-options.label.iconSize"></span></label>
        <input type="text" id="node-input-iconSize" data-i18n="[placeholder]ui-switch-options.placeholder.iconSize">
    </div>
    <div class="form-row">
        <label for="node-input-buttonColor"><i class="fa fa-hand-pointer-o"></i> <span data-i18n="ui-switch-options.label.buttonColor"></span></label>
        <input type="text" id="node-input-buttonColor" data-i18n="[placeholder]ui-switch-options.placeholder.color">
    </div>
</script>
