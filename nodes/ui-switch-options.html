<script type="text/javascript">
    (function () {
        const DEFAULT_PREV = 'chevron-double-left'
        const DEFAULT_NEXT = 'chevron-double-right'
        // Dashboard 2 defaults, used when the group's page has no theme
        const DEFAULT_THEME = { primary: '#0094ce', groupBg: '#ffffff' }
        // Icon sizes in px. S is the size Dashboard uses without a setting, so it is stored as empty.
        const SIZES = { s: { value: '', px: 18 }, m: { value: '24', px: 24 }, l: { value: '32', px: 32 } }
        // Button corner radius in px. Standard is the Vuetify default (4 px), stored as empty. 24 px makes the 48 px high button fully round.
        const RADII = { square: { value: '0', px: 0 }, standard: { value: '', px: 4 }, rounded: { value: '12', px: 12 }, round: { value: '24', px: 24 } }
        // Smallest font size for long text set to "shrink", as in the widget
        const MIN_FONT = 14
        const PALETTE = ['#dc2626', '#ea580c', '#d97706', '#16a34a', '#0d9488', '#0284c7', '#2563eb', '#7c3aed', '#db2777', '#475569', '#0f172a', '#ffffff']
        // Vuetify color names as the widget shows them on icons (v-icon turns names into Vuetify color classes)
        const VUETIFY_COLORS = {
            red: '#f44336', pink: '#e91e63', purple: '#9c27b0', 'deep-purple': '#673ab7', indigo: '#3f51b5', blue: '#2196f3', 'light-blue': '#03a9f4',
            cyan: '#00bcd4', teal: '#009688', green: '#4caf50', 'light-green': '#8bc34a', lime: '#cddc39', yellow: '#ffeb3b', amber: '#ffc107',
            orange: '#ff9800', 'deep-orange': '#ff5722', brown: '#795548', 'blue-grey': '#607d8b', grey: '#9e9e9e', black: '#000000', white: '#ffffff'
        }
        // Shown before searching: icons that suit previous / next buttons
        const SUGGESTED_ICONS = [
            'chevron-double-left', 'chevron-double-right', 'chevron-left', 'chevron-right', 'chevron-up', 'chevron-down',
            'arrow-left', 'arrow-right', 'arrow-left-bold', 'arrow-right-bold', 'arrow-up', 'arrow-down',
            'menu-left', 'menu-right', 'menu-up', 'menu-down', 'minus', 'plus', 'minus-circle-outline', 'plus-circle-outline',
            'skip-previous', 'skip-next', 'rewind', 'fast-forward', 'step-backward', 'step-forward', 'undo', 'redo',
            'page-previous-outline', 'page-next-outline', 'thermometer-minus', 'thermometer-plus', 'volume-minus', 'volume-plus',
            'brightness-5', 'brightness-7', 'fan-minus', 'fan-plus', 'lightbulb-outline', 'lightbulb-on', 'power', 'home'
        ]
        const ICON_GRID_LIMIT = 300

        let mdiIcons = null // null: not loaded, 'loading', 'failed' or { name: codePoint }
        const mdiWaiting = []
        // Stops the preview of the open editor, so late callbacks (icon list, events while closing) do nothing.
        let stopPreview = null

        // Checks an option value stored as text against its type (str, num, bool, json)
        function validValue (option) {
            const value = option.value
            switch (option.valueType) {
                case 'num': return typeof value === 'number' || (String(value).trim() !== '' && !isNaN(Number(value)))
                case 'bool': return value === true || value === false || value === 'true' || value === 'false'
                case 'json':
                    try { JSON.parse(value); return true } catch (e) { return false }
                default: return true
            }
        }

        function iconName (value) {
            return typeof value === 'string' ? value.trim().replace(/^mdi-/, '') : ''
        }

        function loadMdiIcons (done) {
            if (mdiIcons && mdiIcons !== 'loading') return done()
            mdiWaiting.push(done)
            if (mdiIcons === 'loading') return
            mdiIcons = 'loading'
            if (!document.getElementById('uso-mdi-font')) {
                $('<style id="uso-mdi-font"></style>')
                    .text('@font-face{font-family:"uso-mdi";font-display:block;src:url("ui-switch-options/mdi.woff2") format("woff2")}')
                    .appendTo(document.head)
            }
            $.getJSON('ui-switch-options/mdi-icons').done(function (map) {
                mdiIcons = map && typeof map === 'object' && Object.keys(map).length ? map : 'failed'
            }).fail(function () {
                mdiIcons = 'failed'
            }).always(function () {
                mdiWaiting.splice(0).forEach(function (fn) { fn() })
            })
        }

        function glyph (name) {
            const code = mdiIcons && typeof mdiIcons === 'object' ? mdiIcons[name] : undefined
            return code ? String.fromCodePoint(parseInt(code, 16)) : ''
        }

        function hexColor (text) {
            const match = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(typeof text === 'string' ? text.trim() : '')
            if (!match) return null
            return '#' + (match[1].length === 3 ? match[1].replace(/./g, '$&$&') : match[1]).toLowerCase()
        }

        // Same rule as the widget: dark icons on light hex colors, white ones on dark colors
        function contrastColor (color) {
            const hex = hexColor(color)
            if (!hex) return undefined
            const [r, g, b] = [1, 3, 5].map(function (i) {
                const c = parseInt(hex.slice(i, i + 2), 16) / 255
                return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
            })
            return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.179 ? '#0f172a' : '#ffffff'
        }

        function sanitize (html) {
            const text = String(html === undefined || html === null ? '' : html)
            return window.DOMPurify ? window.DOMPurify.sanitize(text) : $('<div/>').text(text).html()
        }

        RED.nodes.registerType('ui-switch-options', {
            category: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category'),
            color: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.colors.light'),
            defaults: {
                name: { value: '' },
                group: { type: 'ui-group', required: true },
                order: { value: 0 },
                width: {
                    value: 0,
                    validate: function (v) {
                        const width = v || 0
                        const currentGroup = $('#node-input-group').val() || this.group
                        const groupNode = RED.nodes.node(currentGroup)
                        const valid = !groupNode || +width <= +groupNode.width
                        $('#node-input-size').toggleClass('input-error', !valid)
                        return valid
                    }
                },
                height: { value: 0 },
                label: { value: '' },
                options: {
                    value: [],
                    validate: function (v) { return Array.isArray(v) && v.every(validValue) }
                },
                wrap: { value: true },
                passthru: { value: false },
                prevIcon: { value: '' },
                nextIcon: { value: '' },
                iconColor: { value: '' },
                iconSize: { value: '' },
                buttonColor: { value: '' },
                buttonRadius: { value: '' },
                delay: {
                    value: 0,
                    validate: function (v) { return v === '' || v === undefined || (!isNaN(Number(v)) && Number(v) >= 0) }
                },
                layout: { value: 'center' },
                overflow: { value: 'wrap' }
            },
            inputs: 1,
            outputs: 1,
            icon: 'font-awesome/fa-exchange',
            paletteLabel: 'switch option',
            label: function () {
                return this.name || 'switch option'
            },

            oneditprepare: function () {
                const node = this
                const t = function (key, args) { return node._('ui-switch-options.' + key, args) }
                const $editor = $('#uso-editor')
                let previewIndex = 0
                let ready = false
                stopPreview = function () {
                    ready = false
                    previewObserver.disconnect()
                }

                $('#node-input-size').elementSizer({
                    width: '#node-input-width',
                    height: '#node-input-height',
                    group: '#node-input-group'
                })

                // Nodes from version 1.0 have no passthru setting and always passed input selections on.
                if (node.passthru === undefined) $('#node-input-passthru').prop('checked', true)
                if (node.wrap === undefined) $('#node-input-wrap').prop('checked', true)

                // ---- options list -----------------------------------------------------------------------
                $('#node-input-options-list').editableList({
                    addItem: function (container, index, option) {
                        option = option || { label: '', value: '', valueType: 'str' }
                        const row = $('<div/>', { style: 'display: flex; gap: 10px;' }).appendTo(container)
                        $('<input/>', { type: 'text', class: 'node-input-option-label', style: 'flex: 1;', placeholder: t('label.optionLabel') })
                            .appendTo(row).val(option.label)
                        const value = $('<input/>', { type: 'text', class: 'node-input-option-value', style: 'width: 100%;' })
                        $('<div/>', { style: 'flex: 1;' }).append(value).appendTo(row)
                        value.typedInput({ default: 'str', types: ['str', 'num', 'bool', 'json'] })
                        value.typedInput('type', option.valueType || 'str')
                        value.typedInput('value', typeof option.value === 'string' ? option.value : String(option.value))
                        updatePreview()
                    },
                    removeItem: function () { updatePreview() },
                    sortItems: function () { updatePreview() },
                    header: $('<div/>', { style: 'display: flex; gap: 10px; padding-left: 28px; padding-right: 32px;' }).append(
                        $('<div/>', { style: 'flex: 1;' }).text(t('label.optionLabel')),
                        $('<div/>', { style: 'flex: 1;' }).text(t('label.optionValue'))
                    ),
                    sortable: true,
                    removable: true,
                    height: 'auto',
                    scrollOnAdd: true
                })

                for (const option of node.options || []) {
                    $('#node-input-options-list').editableList('addItem', option)
                }

                // ---- colors -----------------------------------------------------------------------------
                // A row of swatches (standard, transparent for buttons, palette, own color) next to a text field that holds the value.
                function colorField ($input, withTransparent) {
                    const $swatches = $('<div class="uso-swatches" role="radiogroup"></div>')
                    $('<button type="button" class="uso-swatch uso-swatch-default" role="radio" data-color=""><span class="uso-dot"></span><span></span></button>')
                        .attr('title', t('color.defaultHint')).appendTo($swatches).find('span').last().text(t('color.default'))
                    if (withTransparent) {
                        $('<button type="button" class="uso-swatch uso-swatch-transparent" role="radio" data-color="transparent"></button>')
                            .attr({ title: t('color.transparent'), 'aria-label': t('color.transparent') }).appendTo($swatches)
                    }
                    PALETTE.forEach(function (color) {
                        $('<button type="button" class="uso-swatch" role="radio"></button>')
                            .attr({ 'data-color': color, title: color, 'aria-label': color }).css('background-color', color).appendTo($swatches)
                    })
                    $('<label class="uso-swatch uso-swatch-custom"><i class="fa fa-eyedropper" aria-hidden="true"></i><input type="color"></label>')
                        .attr('title', t('color.custom')).appendTo($swatches).find('input').attr('aria-label', t('color.custom'))
                    $input.addClass('uso-color-text').before($swatches)
                    $swatches.on('click', '.uso-swatch[data-color]', function () {
                        $input.val($(this).attr('data-color')).trigger('change')
                    })
                    $swatches.on('input', 'input[type=color]', function () {
                        $input.val(this.value).trigger('change')
                    })
                    $input.on('input change', function () { syncColor($input) })
                    syncColor($input)
                }
                function syncColor ($input) {
                    const value = String($input.val() || '').trim().toLowerCase()
                    const $swatches = $input.siblings('.uso-swatches')
                    const known = value === '' || value === 'transparent' || PALETTE.includes(value)
                    $swatches.find('.uso-swatch').each(function () {
                        const color = $(this).attr('data-color')
                        const on = color === undefined ? !known : color === value
                        $(this).toggleClass('active', on).attr('aria-checked', String(on))
                    })
                    const own = !known && (hexColor(value) || VUETIFY_COLORS[value])
                    $swatches.find('.uso-swatch-custom').toggleClass('uso-has-color', !!own).css({ 'background-color': own || '', color: own ? contrastColor(own) : '' })
                    $swatches.find('input[type=color]').val(hexColor(value) || '#808080')
                }
                colorField($('#node-input-iconColor'), false)
                colorField($('#node-input-buttonColor'), true)

                // ---- icon size and corner radius ---------------------------------------------------------
                // Preset buttons (data-preset) next to a text field in px that holds the value
                function presetField ($input, $presets, presets) {
                    function sync () {
                        const value = String($input.val() || '').trim().replace(/px$/, '')
                        $presets.find('[data-preset]').each(function () {
                            const preset = presets[$(this).attr('data-preset')]
                            $(this).toggleClass('selected', value === preset.value || (value !== '' && Number(value) === preset.px))
                        })
                    }
                    $presets.on('click', '[data-preset]', function () {
                        $input.val(presets[$(this).attr('data-preset')].value).trigger('change')
                    })
                    $input.on('input change', sync)
                    sync()
                }
                presetField($('#node-input-iconSize'), $('#uso-size-presets'), SIZES)
                presetField($('#node-input-buttonRadius'), $('#uso-radius-presets'), RADII)

                // ---- layout -----------------------------------------------------------------------------
                // Nodes from before these settings get the defaults
                if (!node.layout) $('#node-input-layout').val('center')
                if (!node.overflow) $('#node-input-overflow').val('wrap')
                if (node.delay === undefined || node.delay === '') $('#node-input-delay').val(0)

                // ---- icon pickers -----------------------------------------------------------------------
                // A button showing the current icon; it opens a panel with suggestions and a search over all Material Design Icons.
                function iconPicker ($input, fallback) {
                    const $button = $('<button type="button" class="red-ui-button uso-icon-button" aria-haspopup="listbox"><span class="uso-glyph"></span><span class="uso-icon-name"></span><i class="fa fa-caret-down"></i></button>')
                    $input.after($button)
                    const $panel = $('<div class="uso-icon-panel" hidden><input type="text" class="uso-icon-search"><div class="uso-icon-grid" role="listbox"></div><div class="uso-icon-count"></div></div>')
                    $input.closest('.form-row').after($panel)
                    const $search = $panel.find('.uso-icon-search').attr({ placeholder: t('icon.search'), 'aria-label': t('icon.search') })
                    const $grid = $panel.find('.uso-icon-grid')

                    function refresh () {
                        const name = iconName($input.val())
                        $button.find('.uso-glyph').text(glyph(name || fallback))
                        $button.find('.uso-icon-name').text(name || t('icon.default', { name: fallback }))
                    }
                    function option (name, title) {
                        return $('<button type="button" class="uso-icon-option" role="option"></button>')
                            .attr({ 'data-icon': name, title: title || name, 'aria-label': title || name })
                            .toggleClass('active', name === iconName($input.val()))
                            .append($('<span class="uso-glyph"></span>').text(glyph(name || fallback)))
                    }
                    function fill () {
                        $grid.empty()
                        $panel.find('.uso-icon-count').text('')
                        if (mdiIcons === 'loading') return $('<div class="uso-icon-empty"></div>').text(t('icon.loading')).appendTo($grid)
                        const query = $search.val().trim().toLowerCase().replace(/\s+/g, '-').replace(/^mdi-/, '')
                        let names
                        if (!query) {
                            option('', t('icon.default', { name: fallback })).addClass('uso-icon-default').appendTo($grid)
                            names = SUGGESTED_ICONS.filter(function (name) { return mdiIcons[name] })
                            $panel.find('.uso-icon-count').text(t('icon.searchHint', { total: Object.keys(mdiIcons).length }))
                        } else {
                            names = Object.keys(mdiIcons).filter(function (name) { return name.indexOf(query) !== -1 })
                            // Exact and leading matches first
                            names.sort(function (a, b) { return (a.indexOf(query) === 0 ? 0 : 1) - (b.indexOf(query) === 0 ? 0 : 1) || a.length - b.length || (a < b ? -1 : 1) })
                            if (!names.length) $('<div class="uso-icon-empty"></div>').text(t('icon.noMatch')).appendTo($grid)
                            if (names.length > ICON_GRID_LIMIT) $panel.find('.uso-icon-count').text(t('icon.more', { shown: ICON_GRID_LIMIT, total: names.length }))
                        }
                        names.slice(0, ICON_GRID_LIMIT).forEach(function (name) { option(name).appendTo($grid) })
                    }
                    function close () {
                        $panel.prop('hidden', true)
                        $button.attr('aria-expanded', 'false')
                    }
                    $button.on('click', function () {
                        const opening = $panel.prop('hidden')
                        $editor.find('.uso-icon-panel').prop('hidden', true)
                        $editor.find('.uso-icon-button').attr('aria-expanded', 'false')
                        if (!opening) return
                        $panel.prop('hidden', false)
                        $button.attr('aria-expanded', 'true')
                        $search.val('')
                        fill()
                        $search.trigger('focus')
                    })
                    $search.on('input', fill).on('keydown', function (event) {
                        if (event.key === 'Enter') {
                            event.preventDefault()
                            $grid.find('.uso-icon-option').first().trigger('click')
                        }
                    })
                    $panel.on('keydown', function (event) {
                        if (event.key === 'Escape') {
                            event.preventDefault()
                            event.stopPropagation()
                            close()
                            $button.trigger('focus')
                        }
                    })
                    $panel.on('click', '.uso-icon-option', function () {
                        $input.val($(this).attr('data-icon')).trigger('change')
                        close()
                        $button.trigger('focus')
                    })
                    $input.on('change', refresh)
                    // Without the icon list (e.g. Dashboard not found) the name is typed in as before.
                    loadMdiIcons(function () {
                        if (mdiIcons === 'failed') {
                            $button.remove()
                            $panel.remove()
                            $input.attr({ type: 'text', placeholder: fallback })
                        } else {
                            refresh()
                            if (!$panel.prop('hidden')) fill()
                        }
                    })
                    $input.val(iconName($input.val()))
                    refresh()
                }
                iconPicker($('#node-input-prevIcon'), DEFAULT_PREV)
                iconPicker($('#node-input-nextIcon'), DEFAULT_NEXT)

                // ---- preview ----------------------------------------------------------------------------
                function theme () {
                    const result = Object.assign({}, DEFAULT_THEME)
                    const group = RED.nodes.node($('#node-input-group').val())
                    const page = group && RED.nodes.node(group.page)
                    const themeNode = page && page.theme && RED.nodes.node(page.theme)
                    const colors = (themeNode && themeNode.colors) || {}
                    if (hexColor(colors.primary)) result.primary = colors.primary
                    if (hexColor(colors.groupBg)) result.groupBg = colors.groupBg
                    return result
                }
                function previewOptions () {
                    const options = []
                    $('#node-input-options-list').editableList('items').each(function () {
                        const label = $(this).find('.node-input-option-label').val()
                        const value = $(this).find('.node-input-option-value').typedInput('value')
                        if (value !== '') options.push(label || value)
                    })
                    return options
                }
                // Colors as the widget resolves them: icon colors through Vuetify, button colors as CSS.
                function iconColorCss (value, colors) {
                    const name = String(value || '').trim().toLowerCase()
                    if (name === 'primary') return colors.primary
                    return VUETIFY_COLORS[name] || value
                }
                function updatePreview () {
                    const $preview = $('#uso-preview')
                    if (!ready) return
                    const colors = theme()
                    const options = previewOptions()
                    const wrap = $('#node-input-wrap').prop('checked')
                    if (previewIndex >= options.length) previewIndex = 0
                    const canSwitch = options.length > 1
                    const canPrev = canSwitch && (wrap || previewIndex > 0)
                    const canNext = canSwitch && (wrap || previewIndex < options.length - 1)

                    const button = String($('#node-input-buttonColor').val() || '').trim()
                    const icon = String($('#node-input-iconColor').val() || '').trim()
                    const size = String($('#node-input-iconSize').val() || '').trim()
                    const background = button === '' ? colors.primary : button
                    const iconCss = icon ? iconColorCss(icon, colors) : button === 'transparent' ? colors.primary : (contrastColor(button) || '#ffffff')
                    const iconPx = size === '' ? SIZES.s.px + 'px' : /^\d+(\.\d+)?$/.test(size) ? size + 'px' : size
                    const radius = String($('#node-input-buttonRadius').val() || '').trim()
                    const radiusCss = radius === '' ? RADII.standard.px + 'px' : /^\d+(\.\d+)?$/.test(radius) ? radius + 'px' : radius
                    const layout = $('#node-input-layout').val() === 'edges' ? 'edges' : 'center'
                    const overflow = ['shrink', 'ellipsis'].includes($('#node-input-overflow').val()) ? $('#node-input-overflow').val() : 'wrap'

                    // The "standard" swatches show what standard currently means
                    $('#node-input-buttonColor').siblings('.uso-swatches').find('.uso-dot').css('background', colors.primary)
                    $('#node-input-iconColor').siblings('.uso-swatches').find('.uso-dot').css('background', button === 'transparent' ? colors.primary : (contrastColor(button) || '#ffffff'))

                    $preview.css({ 'background-color': colors.groupBg, color: contrastColor(colors.groupBg) === '#ffffff' ? '#ffffff' : '#000000' })
                    const label = $('#node-input-label').val()
                    $preview.find('.uso-w-label').html(sanitize(label)).toggle(label !== '')
                    // All labels on top of each other, only the current one visible, as in the widget
                    $preview.find('.uso-w-body').attr('class', 'uso-w-body uso-layout-' + layout)
                    const delay = Math.max(Number($('#node-input-delay').val()) || 0, 0)
                    $preview.find('.uso-w-countdown').toggle(delay > 0)
                    $preview.find('.uso-w-countdown-bar').css({ 'animation-duration': delay + 's', 'background-color': icon ? iconColorCss(icon, colors) : colors.primary })
                    const $current = $preview.find('.uso-w-current').attr('class', 'uso-w-current uso-overflow-' + overflow).empty()
                    if (!options.length) $('<span class="uso-w-option active"></span>').text(t('preview.noOptions')).appendTo($current)
                    options.forEach(function (option, i) {
                        $('<span class="uso-w-option"></span>').toggleClass('active', i === previewIndex).html(sanitize(option)).appendTo($current)
                    })
                    $preview.find('.uso-w-btn').each(function () {
                        const prev = $(this).attr('data-step') === '-1'
                        const enabled = prev ? canPrev : canNext
                        const name = iconName($(prev ? '#node-input-prevIcon' : '#node-input-nextIcon').val()) || (prev ? DEFAULT_PREV : DEFAULT_NEXT)
                        $(this).prop('disabled', !enabled).toggleClass('uso-w-flat', button === 'transparent')
                            .css({ 'background-color': enabled ? background : '', 'border-radius': radiusCss })
                        $(this).find('.uso-glyph').text(glyph(name)).css({ color: enabled ? iconCss : '', 'font-size': iconPx })
                    })
                    fitPreview()
                }
                // Same as fit() in the widget: "shrink" uses one font size for all options, as large as possible
                // while every label fits on one line, not below MIN_FONT. Cut off text gets a tooltip.
                function fitPreview () {
                    const box = $('#uso-preview .uso-w-current')[0]
                    if (!box) return
                    box.style.fontSize = ''
                    if (box.classList.contains('uso-overflow-shrink') && box.clientWidth > 0) {
                        const labels = Array.from(box.children)
                        box.classList.add('uso-measuring')
                        let size = parseFloat(getComputedStyle(box).fontSize)
                        while (size > MIN_FONT && labels.some(function (label) { return label.scrollWidth > label.clientWidth + 1 })) {
                            size = Math.max(size - 1, MIN_FONT)
                            box.style.fontSize = size + 'px'
                        }
                        box.classList.remove('uso-measuring')
                    }
                    const active = box.querySelector('.uso-w-option.active')
                    const cut = active && (active.scrollHeight > active.clientHeight + 1 || active.scrollWidth > active.clientWidth + 1)
                    box.title = cut ? active.textContent.trim() : ''
                }
                // The preview can be made narrower at its lower right corner, to see how long text behaves in a narrow widget.
                let previewWidth = -1
                const previewObserver = new ResizeObserver(function (entries) {
                    const width = Math.round(entries[0].contentRect.width)
                    if (width === previewWidth) return
                    previewWidth = width
                    requestAnimationFrame(function () { if (ready) fitPreview() })
                })
                previewObserver.observe($('#uso-preview')[0])
                $('#uso-preview').on('click', '.uso-w-btn', function () {
                    const count = previewOptions().length
                    if (!count) return
                    const next = previewIndex + Number($(this).attr('data-step'))
                    const before = previewIndex
                    previewIndex = $('#node-input-wrap').prop('checked') ? (next + count) % count : Math.min(Math.max(next, 0), count - 1)
                    // With a send delay the bar runs empty again, as in the widget
                    if (previewIndex !== before) $('#uso-preview .uso-w-countdown').empty().append('<div class="uso-w-countdown-bar"></div>')
                    updatePreview()
                })
                $('#uso-preview-toggle').on('click', function () {
                    const open = $('#uso-preview-body').prop('hidden')
                    $('#uso-preview-body').prop('hidden', !open)
                    $(this).attr('aria-expanded', String(open)).find('i').toggleClass('fa-angle-down', open).toggleClass('fa-angle-right', !open)
                })
                $editor.on('input change', 'input, select', updatePreview)
                ready = true
                loadMdiIcons(updatePreview)
                updatePreview()
            },

            oneditcancel: function () {
                if (stopPreview) stopPreview()
                stopPreview = null
            },

            oneditsave: function () {
                const node = this
                if (stopPreview) stopPreview()
                stopPreview = null
                node.options = []
                $('#node-input-options-list').editableList('items').each(function () {
                    const label = $(this).find('.node-input-option-label').val()
                    const input = $(this).find('.node-input-option-value')
                    const valueType = input.typedInput('type')
                    const value = input.typedInput('value')
                    // An option needs a value. Without a label the value is shown.
                    if (value === '') return
                    node.options.push({ label: label || value, value, valueType })
                })
            }
        })
    })()
</script>
