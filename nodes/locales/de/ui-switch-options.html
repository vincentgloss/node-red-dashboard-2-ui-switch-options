<script type="text/html" data-help-name="ui-switch-options">
    <p>Ein Dashboard-Widget, das mit den Buttons <b>zurück</b> und <b>weiter</b> durch eine Liste von Optionen schaltet.
        Bei jedem Umschalten wird der Wert der gewählten Option gesendet.</p>

    <h3>Eingaben</h3>
    <p>Zuerst werden <code>msg.options</code> und <code>msg.ui_update</code> angewendet.
        Danach wird eine Option gewählt: über <code>msg.index</code>, sonst über <code>msg.step</code>, sonst über <code>msg.payload</code>.</p>
    <dl class="message-properties">
        <dt class="optional">payload <span class="property-type">beliebig</span></dt>
        <dd>Wählt die Option mit diesem Wert. Text und Zahlen passen zueinander, <code>1</code> wählt also die Option <code>"1"</code>
            und <code>"true"</code> die Option <code>true</code>. Objekte passen zu Optionen mit gleichem JSON.
            Passt keine Option, zeigt der Node eine Warnung und nichts ändert sich.</dd>
        <dt class="optional">index <span class="property-type">number</span></dt>
        <dd>Wählt die Option an dieser Position, beginnend bei 0.</dd>
        <dt class="optional">step <span class="property-type">number</span></dt>
        <dd>Geht um so viele Optionen weiter: <code>1</code> ist weiter, <code>-1</code> zurück. Beachtet die Einstellung für die Enden.</dd>
        <dt class="optional">options <span class="property-type">array</span></dt>
        <dd>Ersetzt die Optionen. Entweder einfache Werte, z. B. <code>["Aus","An"]</code> oder <code>[18,20,22]</code>,
            oder Objekte, z. B. <code>[{"label":"Aus","value":"off"},{"label":"An","value":"on"}]</code>.
            Ohne <code>label</code> wird der Wert angezeigt, ohne <code>value</code> wird die Beschriftung gesendet.
            Die aktuelle Option bleibt gewählt, wenn sie noch in der Liste ist, sonst die erste.</dd>
        <dt class="optional">ui_update <span class="property-type">object</span></dt>
        <dd>Ändert das Aussehen: <code>label</code>, <code>prevIcon</code>, <code>nextIcon</code>, <code>iconColor</code>,
            <code>iconSize</code>, <code>buttonColor</code>, <code>buttonRadius</code>, z. B. <code>{"label":"Modus","buttonColor":"red"}</code>.
            <code>null</code> stellt die Einstellung aus dem Editor wieder her. <code>class</code> fügt CSS-Klassen hinzu.</dd>
        <dt class="optional">enabled <span class="property-type">boolean</span></dt>
        <dd><code>false</code> sperrt die Buttons, <code>true</code> gibt sie wieder frei.</dd>
        <dt class="optional">visible <span class="property-type">boolean</span></dt>
        <dd><code>false</code> blendet das Widget aus, <code>true</code> wieder ein.</dd>
        <dt class="optional">class <span class="property-type">string</span></dt>
        <dd>Fügt dem Widget CSS-Klassen hinzu.</dd>
    </dl>

    <h3>Ausgaben</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">beliebig</span></dt>
        <dd>Der Wert der gewählten Option, mit dem Typ aus dem Editor (Text, Zahl, Boolean oder JSON).</dd>
        <dt>label <span class="property-type">string</span></dt>
        <dd>Die Beschriftung der gewählten Option.</dd>
        <dt>index <span class="property-type">number</span></dt>
        <dd>Die Position der gewählten Option, beginnend bei 0.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>Aus der Eingabe-Nachricht übernommen, falls sie eins hatte.</dd>
    </dl>

    <h3>Details</h3>
    <p>Eine Nachricht wird gesendet, wenn jemand im Dashboard umschaltet. Wählt eine Eingabe-Nachricht eine Option,
        wird nur dann eine Nachricht gesendet, wenn <i>Nachricht senden, wenn eine Eingabe-Nachricht eine Option wählt</i> angehakt ist.
        Alle offenen Dashboards zeigen dieselbe Option.
        Mit <i>Senden nach</i> wird eine Auswahl im Dashboard erst gesendet, wenn eine Weile nicht weiter umgeschaltet wurde.</p>
    <p>Nach einem Deploy startet das Widget wieder mit den Optionen und dem Aussehen aus dem Editor.
        Die gewählte Option bleibt erhalten, wenn sie dort noch vorkommt.</p>

    <h3>Einstellungen</h3>
    <p>Unter Name, Gruppe und Größe zeigt eine <b>Vorschau</b> das Widget mit den aktuellen Einstellungen und den Farben aus dem Theme der Gruppe.
        Mit ihren Buttons blätterst du durch die Optionen. An der rechten unteren Ecke lässt sie sich schmaler ziehen,
        um zu sehen, wie sich langer Text in einem schmalen Widget verhält. Beim Scrollen bleibt sie oben stehen.</p>
    <dl class="message-properties">
        <dt>Gruppe, Größe</dt>
        <dd>Wo das Widget im Dashboard erscheint und wie viel Platz es einnimmt.</dd>
        <dt>Beschriftung</dt>
        <dd>Optionaler Text über dem Widget. HTML ist erlaubt.</dd>
        <dt>Optionen</dt>
        <dd>Die Liste zum Durchschalten. Jede Option hat eine Beschriftung (angezeigt, HTML erlaubt) und einen Wert (gesendet).
            Der Wert kann Text, eine Zahl, ein Boolean oder JSON sein.</dd>
        <dt>Nach der letzten Option wieder bei der ersten beginnen</dt>
        <dd>Ohne Haken bleiben die Buttons bei der ersten und der letzten Option stehen.</dd>
        <dt>Nachricht senden, wenn eine Eingabe-Nachricht eine Option wählt</dt>
        <dd>Ohne Haken lassen, wenn das Widget nur einen Zustand anzeigt, damit keine Nachricht im Kreis läuft.</dd>
        <dt>Senden nach</dt>
        <dd>0 sendet sofort. Mit einer Zeit in Sekunden wird eine Auswahl im Dashboard erst gesendet, wenn so lange nicht weiter
            umgeschaltet wurde. Jeder Klick startet die Wartezeit neu, ein Balken in der Icon-Farbe unter den Buttons zeigt sie an.
            So lassen sich Optionen überspringen, ohne etwas auszulösen. Ist man am Ende wieder bei der Ausgangsoption, wird nichts gesendet.
            Wählt eine Eingabe-Nachricht in der Wartezeit eine Option, wird die wartende Auswahl verworfen.</dd>
        <dt>Layout</dt>
        <dd><i>Zentriert</i>: Der Text ist so breit wie die längste Option, die Buttons stehen direkt daneben.
            <i>Buttons am Rand</i>: Die Buttons stehen links und rechts am Rand, der Text nutzt den Platz dazwischen.
            In beiden Fällen bleiben die Buttons beim Umschalten an ihrer Stelle.</dd>
        <dt>Langer Text</dt>
        <dd>Was passiert, wenn eine Beschriftung nicht in den Platz passt.
            <i>Umbrechen</i>: höchstens 2 Zeilen, dann „…“.
            <i>Verkleinern</i>: Die Schrift wird für alle Optionen gleich so weit kleiner, dass sie in eine Zeile passen, höchstens bis 14 px.
            Reicht das nicht, wird umgebrochen wie bei <i>Umbrechen</i>.
            <i>Eine Zeile</i>: sofort „…“. Gekürzter Text erscheint vollständig als Tooltip.</dd>
        <dt>Icon zurück, Icon weiter</dt>
        <dd>Ein Klick öffnet die Icon-Auswahl mit passenden Vorschlägen. Die Suche findet alle
            <a href="https://pictogrammers.com/library/mdi/" target="_blank">Material Design Icons</a> des installierten Dashboards.
            Standard: <code>chevron-double-left</code> und <code>chevron-double-right</code>.</dd>
        <dt>Icon-Größe</dt>
        <dd><b>S</b> (18 px, Standard), <b>M</b> (24 px) oder <b>L</b> (32 px). Im Feld daneben steht eine eigene Größe in Pixeln.</dd>
        <dt>Icon-Farbe, Button-Farbe</dt>
        <dd>Eine Farbe aus der Palette, eine eigene über die Pipette, oder im Textfeld ein Wert wie <code>#AEEA00</code>
            oder ein <a href="https://vuetifyjs.com/en/styles/colors/" target="_blank">Farbname</a> wie <code>teal</code>.
            <i>Standard</i> nutzt das Theme. Bei der Button-Farbe gibt es zusätzlich <i>Transparent</i>: kein Hintergrund und kein Schatten.
            Ohne eigene Icon-Farbe ist das Icon auf transparenten Buttons in der Theme-Farbe und auf hellen Buttons dunkel.</dd>
        <dt>Ecken</dt>
        <dd>Rundung der Buttons: <i>Eckig</i> (0 px), <i>Standard</i> (4 px), <i>Abgerundet</i> (12 px) oder <i>Rund</i> (24 px).
            Im Feld daneben steht ein eigener Radius in Pixeln.</dd>
    </dl>
</script>
