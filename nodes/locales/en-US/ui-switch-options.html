<script type="text/html" data-help-name="ui-switch-options">
    <p>A Dashboard widget that steps through a list of options with <b>previous</b> and <b>next</b> buttons.
        Every switch sends the value of the selected option.</p>

    <h3>Inputs</h3>
    <p>First <code>msg.options</code> and <code>msg.ui_update</code> are applied.
        Then one option is selected: by <code>msg.index</code>, otherwise by <code>msg.step</code>, otherwise by <code>msg.payload</code>.</p>
    <dl class="message-properties">
        <dt class="optional">payload <span class="property-type">any</span></dt>
        <dd>Selects the option with this value. Text and numbers match each other, so <code>1</code> selects the option <code>"1"</code>
            and <code>"true"</code> the option <code>true</code>. Objects match options with the same JSON.
            If no option matches, the node shows a warning and nothing changes.</dd>
        <dt class="optional">index <span class="property-type">number</span></dt>
        <dd>Selects the option at this position, starting at 0.</dd>
        <dt class="optional">step <span class="property-type">number</span></dt>
        <dd>Moves by this many options: <code>1</code> is next, <code>-1</code> previous. Follows the setting for the ends.</dd>
        <dt class="optional">options <span class="property-type">array</span></dt>
        <dd>Replaces the options. Either plain values, e.g. <code>["Off","On"]</code> or <code>[18,20,22]</code>,
            or objects, e.g. <code>[{"label":"Off","value":"off"},{"label":"On","value":"on"}]</code>.
            Without a <code>label</code> the value is shown, without a <code>value</code> the label is sent.
            The current option stays selected if it is still in the list, otherwise the first one.</dd>
        <dt class="optional">ui_update <span class="property-type">object</span></dt>
        <dd>Changes the appearance: <code>label</code>, <code>prevIcon</code>, <code>nextIcon</code>, <code>iconColor</code>,
            <code>iconSize</code>, <code>buttonColor</code>, <code>buttonRadius</code>, e.g. <code>{"label":"Mode","buttonColor":"red"}</code>.
            <code>null</code> returns to the setting from the editor. <code>class</code> adds CSS classes.</dd>
        <dt class="optional">enabled <span class="property-type">boolean</span></dt>
        <dd><code>false</code> disables the buttons, <code>true</code> enables them again.</dd>
        <dt class="optional">visible <span class="property-type">boolean</span></dt>
        <dd><code>false</code> hides the widget, <code>true</code> shows it again.</dd>
        <dt class="optional">class <span class="property-type">string</span></dt>
        <dd>Adds CSS classes to the widget.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>The value of the selected option, with its type from the editor (text, number, boolean or JSON).</dd>
        <dt>label <span class="property-type">string</span></dt>
        <dd>The label of the selected option.</dd>
        <dt>index <span class="property-type">number</span></dt>
        <dd>The position of the selected option, starting at 0.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>Taken from the input message, if it had one.</dd>
    </dl>

    <h3>Details</h3>
    <p>A message is sent when somebody switches in a dashboard. When an input message selects an option,
        a message is only sent if <i>Send a message when an input message selects an option</i> is checked.
        All open dashboards show the same option.
        With <i>Send after</i>, a selection in the dashboard is sent only after no further switching for a while.</p>
    <p>After a redeploy the widget starts with the options and appearance from the editor again.
        The selected option is kept if it is still one of them.</p>

    <h3>Configuration</h3>
    <p>Below name, group and size a <b>preview</b> shows the widget with the current settings and the colors of the group's theme.
        Its buttons step through the options. Drag its lower right corner to make it narrower and see how long text
        behaves in a narrow widget. It stays at the top while scrolling.</p>
    <dl class="message-properties">
        <dt>Group, Size</dt>
        <dd>Where the widget appears in the dashboard and how much room it takes.</dd>
        <dt>Label</dt>
        <dd>Optional text above the widget. HTML is allowed.</dd>
        <dt>Options</dt>
        <dd>The list to step through. Each option has a label (shown, HTML allowed) and a value (sent).
            The value can be text, a number, a boolean or JSON.</dd>
        <dt>After the last option, start again at the first</dt>
        <dd>If unchecked, the buttons stop at the first and the last option.</dd>
        <dt>Send a message when an input message selects an option</dt>
        <dd>Leave unchecked if the widget only shows a state, so a message cannot loop back.</dd>
        <dt>Send after</dt>
        <dd>0 sends at once. With a time in seconds, a selection in the dashboard is sent only after no further switching
            for that long. Every click starts the wait again, and a bar in the icon color below the buttons shows it.
            That way options can be skipped without triggering anything. Back at the starting option, nothing is sent.
            If an input message selects an option during the wait, the waiting selection is dropped.</dd>
        <dt>Layout</dt>
        <dd><i>Centered</i>: the text is as wide as the longest option, the buttons sit right next to it.
            <i>Buttons at the edges</i>: the buttons sit at the left and right edge, the text uses the room between them.
            Either way the buttons stay in place when the option changes.</dd>
        <dt>Long text</dt>
        <dd>What happens when a label does not fit.
            <i>Wrap</i>: at most 2 lines, then "…".
            <i>Shrink</i>: the font gets smaller, the same for all options, until they fit on one line, down to 14 px.
            If that is not enough, the text wraps as with <i>Wrap</i>.
            <i>One line</i>: "…" right away. Cut off text is shown in full as a tooltip.</dd>
        <dt>Prev icon, Next icon</dt>
        <dd>A click opens the icon picker with suitable suggestions. The search covers all
            <a href="https://pictogrammers.com/library/mdi/" target="_blank">Material Design icons</a> of the installed Dashboard.
            Default: <code>chevron-double-left</code> and <code>chevron-double-right</code>.</dd>
        <dt>Icon size</dt>
        <dd><b>S</b> (18 px, default), <b>M</b> (24 px) or <b>L</b> (32 px). The field next to them takes an own size in pixels.</dd>
        <dt>Icon color, Button color</dt>
        <dd>A color from the palette, your own with the eyedropper, or in the text field a value like <code>#AEEA00</code>
            or a <a href="https://vuetifyjs.com/en/styles/colors/" target="_blank">color name</a> like <code>teal</code>.
            <i>Default</i> uses the theme. The button color also offers <i>Transparent</i>: no background and no shadow.
            Without an own icon color, the icon uses the theme color on transparent buttons and turns dark on light buttons.</dd>
        <dt>Corners</dt>
        <dd>Corner radius of the buttons: <i>Square</i> (0 px), <i>Default</i> (4 px), <i>Rounded</i> (12 px) or <i>Round</i> (24 px).
            The field next to them takes an own radius in pixels.</dd>
    </dl>
</script>
